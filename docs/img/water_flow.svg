<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 860" width="1440" height="860" font-family="Helvetica, Arial, sans-serif">
  <title>Open Dedica — water path schematic</title>
  <defs>
    <marker id="aC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f7fd1"/></marker>
    <marker id="aH" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d64545"/></marker>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#eef1f5" stroke-width="1"/></pattern>
    <style>
      .name{font-size:15px;font-weight:700;fill:#1f2733}
      .od{font-size:13px;font-weight:700;fill:#2f6db5;font-family:Menlo,Consolas,monospace}
      .oem{font-size:11.5px;fill:#6b7582;font-family:Menlo,Consolas,monospace}
      .note{font-size:12px;font-style:italic;fill:#5b6572}
      .pill{font-size:11px;font-weight:700;font-family:Menlo,Consolas,monospace}
      .cold{stroke:#2f7fd1;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .hot{stroke:#d64545;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .p2{stroke-dasharray:14 9}
      .ln{stroke:#2b3440;stroke-width:2}
    </style>
  </defs>

  <rect width="1440" height="860" fill="#ffffff"/>
  <rect width="1440" height="860" fill="url(#grid)"/>

  <!-- Title -->
  <text x="50" y="52" font-size="26" font-weight="700" fill="#1f2733">Open Dedica — water path</text>
  <text x="50" y="78" font-size="14" fill="#5b6572">Hydraulic flow of the De'Longhi Dedica EC685 core · part numbers from docs/bom.csv</text>

  <!-- ============ PHASE 2 FRAME ============ -->
  <rect x="236" y="458" width="600" height="222" rx="16" fill="#fff6f0" fill-opacity="0.55" stroke="#e39a6c" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="236" y="458" width="330" height="26" rx="13" fill="#e39a6c"/>
  <text x="252" y="476" font-size="12.5" font-weight="700" fill="#fff">STEAM SYSTEM · OD-S00 · phase 2 (not in v1)</text>

  <!-- ============ PIPES (drawn first, components on top) ============ -->
  <!-- cold side -->
  <path class="cold" d="M202 250H290" marker-end="url(#aC)"/>
  <path class="cold" d="M366 250H436" marker-end="url(#aC)"/>
  <path class="cold" d="M642 250H720" marker-end="url(#aC)"/>
  <path class="cold" d="M857 250H1064" marker-end="url(#aC)"/>
  <path class="cold" d="M790 332V400H100V346" marker-end="url(#aC)"/>
  <!-- hot side -->
  <path class="hot" d="M1160 324V486" marker-end="url(#aH)"/>
  <path class="hot" d="M1160 592V634" marker-end="url(#aH)"/>
  <path class="hot p2" d="M1096 540H776" marker-end="url(#aH)"/>
  <path class="hot p2" d="M668 540H430" marker-end="url(#aH)"/>

  <!-- tube pills -->
  <g class="pill" text-anchor="middle">
    <rect x="214" y="240" width="68" height="20" rx="10" fill="#fff" stroke="#2f7fd1" stroke-width="2"/><text x="248" y="254" fill="#2f7fd1">OD-W11</text>
    <rect x="368" y="240" width="68" height="20" rx="10" fill="#fff" stroke="#2f7fd1" stroke-width="2"/><text x="402" y="254" fill="#2f7fd1">OD-H25</text>
    <rect x="648" y="240" width="68" height="20" rx="10" fill="#fff" stroke="#2f7fd1" stroke-width="2"/><text x="682" y="254" fill="#2f7fd1">TUBE 1</text>
    <rect x="928" y="240" width="68" height="20" rx="10" fill="#fff" stroke="#2f7fd1" stroke-width="2"/><text x="962" y="254" fill="#2f7fd1">TUBE 2</text>
    <rect x="416" y="390" width="68" height="20" rx="10" fill="#fff" stroke="#2f7fd1" stroke-width="2"/><text x="450" y="404" fill="#2f7fd1">TUBE 3</text>
    <rect x="1126" y="390" width="68" height="20" rx="10" fill="#fff" stroke="#d64545" stroke-width="2"/><text x="1160" y="404" fill="#d64545">TUBE 4</text>
    <rect x="901" y="530" width="68" height="20" rx="10" fill="#fff" stroke="#d64545" stroke-width="2"/><text x="935" y="544" fill="#d64545">TUBE 5</text>
    <rect x="515" y="530" width="68" height="20" rx="10" fill="#fff" stroke="#d64545" stroke-width="2"/><text x="549" y="544" fill="#d64545">TUBE 6</text>
    <rect x="1126" y="603" width="68" height="20" rx="10" fill="#fff" stroke="#d64545" stroke-width="2"/><text x="1160" y="617" fill="#d64545">TUBE 7</text>
  </g>
  <text class="note" x="450" y="428" text-anchor="middle">bypass / over-pressure return to tank</text>

  <!-- ============ COMPONENTS ============ -->

  <!-- Water tank -->
  <g>
    <rect x="60" y="165" width="140" height="178" rx="12" fill="#dfe7ee" stroke="#2b3440" stroke-width="2"/>
    <rect x="62" y="222" width="136" height="119" rx="10" fill="#9cc7ec"/>
    <path d="M62 224q17-8 34 0t34 0t34 0t34 0" fill="none" stroke="#5d9fd6" stroke-width="2"/>
    <rect x="54" y="152" width="152" height="22" rx="8" fill="#2b2f36"/>
    <rect x="160" y="160" width="36" height="24" rx="4" fill="#2b2f36"/>
    <path d="M80 190V330" stroke="#ffffff" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round"/>
    <text x="178" y="212" font-size="10" fill="#6b7582" text-anchor="middle">MAX</text>
    <path d="M166 216h24" stroke="#6b7582" stroke-width="1.5"/>
  </g>
  <text class="name" x="130" y="104" text-anchor="middle">Water tank</text>
  <text class="od" x="130" y="122" text-anchor="middle">OD-W01</text>
  <text class="oem" x="130" y="138" text-anchor="middle">5513200359</text>

  <!-- Flowmeter -->
  <g>
    <path d="M318 214V196M330 214V192M342 214V196" stroke-width="3" stroke-linecap="round" stroke="#2b2f36"/>
    <circle cx="342" cy="194" r="0"/>
    <path d="M318 196l-4-6M330 192v-6M342 196l4-6" stroke-width="3" stroke-linecap="round" stroke="#d64545"/>
    <rect x="292" y="212" width="76" height="76" rx="14" fill="#f4f1e6" stroke="#2b3440" stroke-width="2"/>
    <circle cx="330" cy="250" r="26" fill="#ffffff" stroke="#2b3440" stroke-width="1.5"/>
    <g stroke="#2f7fd1" stroke-width="3" stroke-linecap="round">
      <path d="M330 250l0-20M330 250l17 10M330 250l-17 10"/>
      <path d="M330 250l17-10M330 250l-17-10M330 250l0 20" stroke="#8ab8e6"/>
    </g>
    <circle cx="330" cy="250" r="5" fill="#2b3440"/>
  </g>
  <text class="name" x="330" y="146" text-anchor="middle">Flowmeter</text>
  <text class="od" x="330" y="164" text-anchor="middle">OD-H24</text>
  <text class="oem" x="330" y="180" text-anchor="middle">5213225251</text>
  <text class="note" x="330" y="312" text-anchor="middle">pulses → dose</text>

  <!-- Pump -->
  <g>
    <rect x="438" y="243" width="20" height="14" rx="3" fill="#d9473a" stroke="#2b3440" stroke-width="1.5"/>
    <rect x="454" y="212" width="126" height="80" rx="4" fill="#c9ced6" stroke="#2b3440" stroke-width="2"/>
    <rect x="466" y="200" width="98" height="72" rx="8" fill="#d9473a" stroke="#2b3440" stroke-width="2"/>
    <rect x="490" y="188" width="10" height="14" fill="#c9ced6" stroke="#2b3440" stroke-width="1.5"/>
    <rect x="514" y="188" width="10" height="14" fill="#c9ced6" stroke="#2b3440" stroke-width="1.5"/>
    <rect x="466" y="274" width="98" height="12" fill="#8fd18a" stroke="#2b3440" stroke-width="1"/>
    <text x="515" y="284" font-size="9" font-weight="700" fill="#1f2733" text-anchor="middle">ULKA EP5</text>
    <rect x="578" y="240" width="64" height="20" rx="6" fill="#f4f1e6" stroke="#2b3440" stroke-width="2"/>
    <path d="M598 240v20M620 240v20" stroke="#2b3440" stroke-width="1"/>
  </g>
  <text class="name" x="530" y="146" text-anchor="middle">Pump · ULKA EP5 48 W</text>
  <text class="od" x="530" y="164" text-anchor="middle">OD-H01</text>
  <text class="oem" x="530" y="180" text-anchor="middle">AS00002825</text>
  <text class="note" x="530" y="312" text-anchor="middle">vibratory, 15 bar max</text>

  <!-- 3-way valve (OPV / bypass) -->
  <g>
    <rect x="722" y="241" width="46" height="18" rx="5" fill="#f4f1e6" stroke="#2b3440" stroke-width="2"/>
    <rect x="812" y="241" width="46" height="18" rx="5" fill="#f4f1e6" stroke="#2b3440" stroke-width="2"/>
    <rect x="781" y="296" width="18" height="36" rx="5" fill="#f4f1e6" stroke="#2b3440" stroke-width="2"/>
    <rect x="762" y="200" width="56" height="102" rx="10" fill="#f4f1e6" stroke="#2b3440" stroke-width="2"/>
    <rect x="758" y="222" width="64" height="16" rx="4" fill="#e8e3d1" stroke="#2b3440" stroke-width="2"/>
    <path d="M780 250l20 0M784 256l6 6 6-6 6 6 6-6M784 268l6 6 6-6 6 6 6-6" fill="none" stroke="#2b3440" stroke-width="1.8"/>
    <circle cx="790" cy="250" r="5" fill="#2b3440"/>
  </g>
  <text class="name" x="790" y="146" text-anchor="middle">3-way valve (OPV)</text>
  <text class="od" x="790" y="164" text-anchor="middle">OD-H22</text>
  <text class="oem" x="790" y="180" text-anchor="middle">AS00004266</text>

  <!-- Thermoblock -->
  <g>
    <rect x="1064" y="240" width="46" height="20" rx="5" fill="#f4f1e6" stroke="#2b3440" stroke-width="2"/>
    <path d="M1076 240v20M1090 240v20" stroke="#2b3440" stroke-width="1"/>
    <rect x="1150" y="296" width="20" height="26" rx="5" fill="#f4f1e6" stroke="#2b3440" stroke-width="2"/>
    <circle cx="1160" cy="250" r="58" fill="#b9c0c9" stroke="#2b3440" stroke-width="2"/>
    <circle cx="1160" cy="250" r="46" fill="none" stroke="#d64545" stroke-width="3" stroke-dasharray="10 5"/>
    <circle cx="1160" cy="250" r="24" fill="#ffffff" stroke="#2b3440" stroke-width="2"/>
    <circle cx="1160" cy="250" r="24" fill="#e3e7ec"/>
    <text x="1160" y="255" font-size="12" font-weight="700" fill="#1f2733" text-anchor="middle">1300 W</text>
    <path d="M1108 212l-14-8M1116 200l-12-12" stroke="#c7773a" stroke-width="5" stroke-linecap="round"/>
    <rect x="1198" y="188" width="24" height="12" rx="3" fill="#2b2f36"/>
    <rect x="1224" y="204" width="14" height="10" rx="3" fill="#2f7fd1"/>
  </g>
  <text class="name" x="1160" y="120" text-anchor="middle">Thermoblock (boiler)</text>
  <text class="od" x="1160" y="138" text-anchor="middle">OD-H11</text>
  <text class="oem" x="1160" y="154" text-anchor="middle">5513226671</text>
  <text class="note" x="1232" y="276">NTC OD-H16</text>
  <text class="note" x="1232" y="294">TCO 192 °C OD-H18</text>

  <!-- 3-way valve connector (steam / coffee split) -->
  <g>
    <rect x="1150" y="484" width="20" height="30" rx="4" fill="#2b2f36"/>
    <rect x="1094" y="530" width="30" height="20" rx="4" fill="#2b2f36"/>
    <rect x="1150" y="566" width="20" height="28" rx="4" fill="#2b2f36"/>
    <ellipse cx="1160" cy="540" rx="46" ry="30" fill="#3a3f47" stroke="#1a1d22" stroke-width="2"/>
    <circle cx="1160" cy="540" r="16" fill="#2b2f36" stroke="#6b7582" stroke-width="1.5"/>
    <path d="M1152 530l8 4-8 4 8 4-8 4 8 4" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    <g font-size="12" font-weight="700" fill="#1f2733">
      <text x="1178" y="498">A</text>
      <text x="1098" y="524">B</text>
      <text x="1178" y="590">C</text>
    </g>
  </g>
  <text class="name" x="1224" y="512">3-way valve connector</text>
  <text class="od" x="1224" y="530">OD-H23</text>
  <text class="oem" x="1224" y="546">AS00005380</text>
  <text class="note" x="1224" y="566">pressure-controlled spring valve</text>
  <text class="note" x="1224" y="582">A → C coffee  ·  A → B steam</text>
  <text class="note" x="1000" y="574" text-anchor="middle">v1: port B blanked (OD-F05)</text>

  <!-- Group head + portafilter + cup -->
  <g>
    <rect x="1096" y="636" width="128" height="30" rx="4" fill="#b9c0c9" stroke="#2b3440" stroke-width="2"/>
    <path d="M1108 666h104" stroke="#2b3440" stroke-width="3" stroke-dasharray="3 4"/>
    <path d="M1106 670h108l-10 34h-88z" fill="#8a939e" stroke="#2b3440" stroke-width="2"/>
    <rect x="1212" y="678" width="92" height="16" rx="8" fill="#2b2f36"/>
    <path d="M1148 704v10M1172 704v10" stroke="#2b3440" stroke-width="4" stroke-linecap="round"/>
    <path d="M1148 722v10M1172 722v10" stroke="#8a5a3c" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 5"/>
    <path d="M1120 740h80l-10 52h-60z" fill="#ffffff" stroke="#2b3440" stroke-width="2"/>
    <path d="M1200 752q22 0 20 16t-24 14" fill="none" stroke="#2b3440" stroke-width="2"/>
    <path d="M1124 758h72" stroke="#8a5a3c" stroke-width="3"/>
  </g>
  <text class="name" x="1080" y="656" text-anchor="end">Group head + portafilter</text>
  <text class="od" x="1080" y="674" text-anchor="end">OD-G00 · OD-G10</text>
  <text class="oem" x="1080" y="690" text-anchor="end">housing OD-G01 is printed</text>

  <!-- Steam valve -->
  <g>
    <rect x="666" y="532" width="28" height="16" rx="4" fill="#2b2f36"/>
    <rect x="746" y="532" width="32" height="16" rx="4" fill="#2b2f36"/>
    <rect x="712" y="494" width="16" height="26" fill="#4a5059"/>
    <path d="M716 496v22M720 496v22M724 496v22" stroke="#2b2f36" stroke-width="1"/>
    <rect x="690" y="514" width="60" height="52" rx="10" fill="#2b2f36" stroke="#1a1d22" stroke-width="2"/>
    <circle cx="720" cy="540" r="12" fill="#3a3f47" stroke="#6b7582" stroke-width="1.5"/>
    <path d="M712 540h16" stroke="#ffffff" stroke-width="2"/>
  </g>
  <text class="name" x="720" y="596" text-anchor="middle">Steam valve (tap)</text>
  <text class="od" x="720" y="614" text-anchor="middle">OD-S01</text>
  <text class="oem" x="720" y="630" text-anchor="middle">AS00002707</text>

  <!-- Steam wand -->
  <g>
    <path d="M430 540H358q-22 0-30 22L296 640" fill="none" stroke="#2b3440" stroke-width="13" stroke-linecap="round"/>
    <path d="M430 540H358q-22 0-30 22L296 640" fill="none" stroke="#d7dce2" stroke-width="9" stroke-linecap="round"/>
    <path d="M338 546l-16 38" stroke="#2b2f36" stroke-width="14" stroke-linecap="round"/>
    <rect x="384" y="526" width="26" height="28" rx="4" fill="#c9ced6" stroke="#2b3440" stroke-width="2"/>
    <path d="M288 636l20 8-6 14-20-8z" fill="#c9ced6" stroke="#2b3440" stroke-width="2"/>
    <path d="M282 664l-6 12M290 667l-2 13M298 670l2 12" stroke="#9aa3ad" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text class="name" x="360" y="604">Steam wand</text>
  <text class="od" x="360" y="622">OD-S02 · OD-S04</text>
  <text class="oem" x="360" y="638">AS00002705 · AS00002710</text>

  <!-- ============ LEGEND ============ -->
  <g transform="translate(50 718)">
    <rect width="560" height="112" rx="10" fill="#ffffff" stroke="#d3d9e0" stroke-width="1.5"/>
    <text x="16" y="24" font-size="13" font-weight="700" fill="#1f2733">Legend</text>
    <path class="cold" d="M16 46h56" marker-end="url(#aC)"/><text x="86" y="50" font-size="12.5" fill="#1f2733">cold water (tank → thermoblock)</text>
    <path class="hot" d="M16 70h56" marker-end="url(#aH)"/><text x="86" y="74" font-size="12.5" fill="#1f2733">hot water / steam (after thermoblock)</text>
    <path class="hot p2" d="M16 94h56" marker-end="url(#aH)"/><text x="86" y="98" font-size="12.5" fill="#1f2733">phase 2 — steam branch, not built in v1</text>
    <text x="330" y="50" font-size="12" fill="#2f6db5" font-weight="700" font-family="Menlo,Consolas,monospace">OD-Xnn</text><text x="386" y="50" font-size="12" fill="#1f2733">project part no.</text>
    <text x="330" y="74" font-size="12" fill="#6b7582" font-family="Menlo,Consolas,monospace">code</text><text x="386" y="74" font-size="12" fill="#1f2733">OEM spare code (BOM)</text>
    <text x="330" y="98" font-size="12" fill="#1f2733">TUBE n — see WATER_FLOW.md</text>
  </g>
  <text x="1390" y="840" font-size="11" fill="#9aa3ad" text-anchor="end">CC BY 4.0 · open-dedica</text>
</svg>
