name: 3D scan request
description: Request photos + caliper sheet + raw STL for a physical part (phase 1)
title: "[Scan] OD-Xnn <part name>"
labels: ["phase: scan", "help wanted"]
body:
  - type: input
    id: part
    attributes:
      label: Part
      description: "OD part number / Ref# / OEM code / name, as in docs/BOM.md"
      placeholder: "OD-H01 / 40 / AS00002825 / ULKA EP5 pump"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why the chassis needs it
      description: Which chassis features touch this part?
  - type: textarea
    id: interfaces
    attributes:
      label: Critical interfaces to measure with calipers
      placeholder: "- mounting hole pattern\n- inlet / outlet spigot Ø"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Scanning notes
      description: Shiny surfaces, flexible rubber, assemblies to scan together, etc.
